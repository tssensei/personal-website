<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Interactive GPU fluid simulation demo by Ziteng Song."
    />
    <title>GPU Fluid Simulation | Ziteng Song</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../layout.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <main class="site-layout">
      <aside class="site-sidebar profile-column" aria-label="Profile">
        <h1 class="site-name">Ziteng Song</h1>
        <p>
          I am a senior student majoring in computer science at Cornell University focused on computer vision
          and graphics.
        </p>
        <p>
          I am currently an undergraduate researcher in Professor Abe Davis's lab.
        </p>
        <ul class="profile-links" aria-label="Links">
          <li><a href="https://github.com/tssensei">GitHub</a></li>
          <li><a href="mailto:zs292@cornell.edu">Email</a></li>
          <li><a href="#">CV</a></li>
        </ul>
      </aside>
      <section class="fluid-demo-column" aria-labelledby="fluid-demo-title">
        <h2 id="fluid-demo-title">GPU Fluid Simulation</h2>
        <div class="fluid-demo-stage" id="fluid-demo-stage">
          <div class="fluid-demo-preview">
            <video
              class="fluid-demo-fallback"
              src="../img/fluid-loop-v3.mp4"
              autoplay
              muted
              loop
              playsinline
              preload="metadata"
            ></video>
            <button class="fluid-demo-launch" id="fluid-demo-launch" type="button">Launch Demo</button>
            <p class="fluid-demo-status" id="fluid-demo-status" role="status" hidden></p>
          </div>
          <div class="fluid-demo-panel-placeholder" aria-hidden="true"></div>
        </div>
      </section>
    </main>
    <script src="./demo.js" defer></script>
  </body>
</html>
